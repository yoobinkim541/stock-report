# 퀀트 터미널 — 토스증권 톤
# 가격 등락은 상승 빨강·하락 파랑. Streamlit 은 양수 델타에 greenColor 를 칠하므로
# greenColor 에 토스 빨강, redColor 에 토스 파랑을 넣는다.

[theme]
base = "dark"
primaryColor = "#3182f6"
backgroundColor = "#17171c"
secondaryBackgroundColor = "#2c2c35"
textColor = "#f2f2f5"
linkColor = "#3182f6"

greenColor = "#f04452"
redColor = "#3182f6"
blueColor = "#3182f6"
orangeColor = "#f59e0b"
violetColor = "#8b95a1"

font = "Pretendard"
headingFont = "Pretendard"
codeFont = "JetBrains Mono"
baseFontSize = 15

baseRadius = "1rem"
buttonRadius = "0.875rem"
borderColor = "#2c2c35"
dataframeBorderColor = "#2c2c35"
dataframeHeaderBackgroundColor = "#202027"
showWidgetBorder = false
showSidebarBorder = true

chartCategoricalColors = ["#3182f6", "#f04452", "#8b95a1", "#f59e0b", "#7aa7f7", "#4e5968", "#fb8a93", "#17171c"]

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-500-normal.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-700-normal.woff2"
weight = 700
style = "normal"

[theme.sidebar]
backgroundColor = "#17171c"
secondaryBackgroundColor = "#2c2c35"
borderColor = "#2c2c35"
