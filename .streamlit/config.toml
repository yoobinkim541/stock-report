# 퀀트 터미널 — 토스증권 톤 (평면 차콜/그레이 · Toss Blue · Pretendard)
# 등락 시맨틱은 상승 초록·하락 빨강(프로젝트 규약). 표면색은 dashboard/theme.py 와 일치.

[theme]
base = "dark"
primaryColor = "#3182f6"
backgroundColor = "#17171c"
secondaryBackgroundColor = "#202027"
textColor = "#f9fafb"
linkColor = "#3182f6"

greenColor = "#26a69a"
redColor = "#ef5350"
blueColor = "#3182f6"
orangeColor = "#f7a600"
violetColor = "#9b5de5"

font = "Pretendard"
headingFont = "Pretendard"
codeFont = "JetBrains Mono"
baseFontSize = 15

baseRadius = "1rem"
buttonRadius = "0.75rem"
borderColor = "#3c3c47"
dataframeBorderColor = "#3c3c47"
dataframeHeaderBackgroundColor = "#202027"
showWidgetBorder = true
showSidebarBorder = true

chartCategoricalColors = ["#3182f6", "#26a69a", "#ef5350", "#f7a600", "#9b5de5", "#00bcd4", "#ff7043", "#66bb6a"]

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-500-normal.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-700-normal.woff2"
weight = 700
style = "normal"

[theme.sidebar]
backgroundColor = "#17171c"
secondaryBackgroundColor = "#202027"
borderColor = "#3c3c47"
